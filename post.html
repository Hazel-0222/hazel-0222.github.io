<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
// 主题预载（防闪烁）：与工具合集共用 localStorage['ui-theme']
(function () {
    try {
        var t = localStorage.getItem('ui-theme');
        if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title id="postTitle">文章 · 开发手账</title>
<script src="https://cdn.jsdelivr.net/npm/marked@14.1.0/marked.min.js"></script>
<style>
:root {
    /* ── 与工具合集统一的设计 Token ── */
    --bg: #eef0fb;
    --page-bg-image:
        radial-gradient(900px 520px at 10% -10%, rgba(0,113,227,.145), transparent 60%),
        radial-gradient(760px 480px at 90% 0%, rgba(122,92,255,.125), transparent 60%),
        radial-gradient(840px 560px at 50% 108%, rgba(255,154,186,.105), transparent 60%),
        linear-gradient(165deg, #e7ecfb 0%, #eee9fc 55%, #f6ecf2 100%);
    --card-bg: #ffffff;
    --input-bg: rgba(255,255,255,0.85);
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --border: #e2e2e7;
    --primary: #0071e3;
    --primary-soft: #e8f2fe;
    --focus-ring: rgba(0,113,227,0.22);
    --hover-bg: rgba(0,0,0,0.045);
    --chip-bg: rgba(0,0,0,0.05);
    --btn-bg: #0071e3;
    --btn-fg: #ffffff;
    --btn2-bg: #e5e5ea;
    --btn2-fg: #1d1d1f;
    --code-bg: #f6f8fa;
    --code-border: #e2e2e7;
    --table-stripe: #f8f9fb;
    --blockquote-bg: #f8f9fb;
    --hd-veil: rgba(255,255,255,0.65);
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-hover: 0 8px 24px rgba(0,0,0,0.12);
    --panel-shadow:
        0 2px 8px rgba(13,25,60,0.04),
        0 24px 56px -16px rgba(13,25,60,0.14);
    --mono: "Cascadia Code", "Fira Code", "JetBrains Mono", "SF Mono", Consolas, monospace;
    --max-width: 760px;
    --toc-w: 230px;
}
[data-theme="dark"] {
    --bg: #0f1016;
    --page-bg-image:
        radial-gradient(900px 520px at 10% -10%, rgba(80,140,255,.13), transparent 60%),
        radial-gradient(760px 480px at 90% 0%, rgba(139,124,255,.10), transparent 60%),
        radial-gradient(840px 560px at 50% 108%, rgba(255,140,180,.06), transparent 60%),
        linear-gradient(165deg, #12131f 0%, #0f0f1a 55%, #150f1b 100%);
    --card-bg: #1a1b22;
    --input-bg: #14151c;
    --text: #ededf1;
    --text-secondary: #9a9ba5;
    --border: #2a2b33;
    --primary: #5ea2f5;
    --primary-soft: rgba(94,162,245,0.16);
    --focus-ring: rgba(94,162,245,0.30);
    --hover-bg: rgba(255,255,255,0.06);
    --chip-bg: rgba(255,255,255,0.08);
    --btn-bg: #5ea2f5;
    --btn-fg: #1d1d1f;
    --btn2-bg: rgba(229,229,234,0.14);
    --btn2-fg: #ededf1;
    --code-bg: #161b22;
    --code-border: #2a2b33;
    --table-stripe: #161b22;
    --blockquote-bg: #14151c;
    --hd-veil: rgba(255,255,255,0.05);
    --shadow: 0 1px 2px rgba(0,0,0,0.5);
    --shadow-hover: 0 8px 24px rgba(0,0,0,0.5);
    --panel-shadow:
        0 8px 20px rgba(0,0,0,0.34),
        0 32px 64px -16px rgba(0,0,0,0.42);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    background-image: var(--page-bg-image);
    background-attachment: fixed;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.8;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: 16px;
    transition: background-color 0.3s, color 0.3s;
}

/* ── 顶部导航 ── */
nav {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(var(--hd-veil), var(--hd-veil)), var(--page-bg-image);
    background-attachment: fixed;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.nav-inner {
    max-width: calc(var(--max-width) + var(--toc-w) + 80px);
    margin: 0 auto; padding: 0 28px;
    display: flex; justify-content: space-between; align-items: center; height: 56px;
}
.nav-logo { font-weight: 700; font-size: 18px; text-decoration: none; color: var(--text); letter-spacing: -0.3px; }
.nav-right { display: flex; align-items: center; gap: 16px; }
.nav-back { text-decoration: none; color: var(--text-secondary); font-size: 14px; transition: color 0.15s; }
.nav-back:hover { color: var(--text); }
.theme-toggle {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--input-bg);
    font-size: 16px; cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.2s;
}
.theme-toggle:hover { transform: scale(1.08); box-shadow: var(--shadow-hover); }

/* ── 布局 ── */
.page {
    max-width: calc(var(--max-width) + var(--toc-w) + 80px);
    margin: 0 auto; padding: 32px 28px 12px;
    display: flex; gap: 28px; align-items: flex-start;
}
.main { flex: 1; min-width: 0; }

/* ── 文章面板 ── */
.panel {
    --panel-pad: 36px;
    --panel-r: 18px;
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: var(--panel-shadow);
    padding: var(--panel-pad);
}
.post-header {
    position: relative;
    z-index: 0;
    margin: calc(-1 * var(--panel-pad)) calc(-1 * var(--panel-pad)) 28px;
    padding: calc(var(--panel-pad) + 10px) var(--panel-pad) 18px;
    border-radius: var(--panel-r) var(--panel-r) 0 0;
}
.post-header::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    background:
        linear-gradient(var(--hd-veil), var(--hd-veil)),
        var(--page-bg-image);
    border-radius: inherit;
}
.post-date { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 500; }
.post-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.3; }
.post-meta { display: flex; gap: 18px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--text-secondary); }

/* ── TOC ── */
.toc-sidebar {
    position: sticky; top: 84px; width: var(--toc-w); flex-shrink: 0;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: var(--panel-shadow);
    padding: 18px 18px 14px;
    font-size: 13px; line-height: 1.6;
    max-height: calc(100vh - 120px); overflow-y: auto;
}
.toc-sidebar::-webkit-scrollbar { width: 4px; }
.toc-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.toc-title {
    font-weight: 600; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-secondary); margin-bottom: 12px;
}
.toc-sidebar a {
    display: block; color: var(--text-secondary); text-decoration: none;
    padding: 3px 0; padding-left: 10px;
    transition: color 0.15s; border-left: 2px solid transparent;
}
.toc-sidebar a:hover, .toc-sidebar a.active { color: var(--primary); border-left-color: var(--primary); }
.toc-sidebar a.toc-h3 { padding-left: 24px; font-size: 12px; }

/* ── 正文 ── */
.content { font-size: 16px; color: var(--text-secondary); }
.content > *:first-child { margin-top: 0 !important; }
.content h1, .content h2, .content h3, .content h4, .content h5, .content h6 {
    color: var(--text); font-weight: 700; line-height: 1.35;
    scroll-margin-top: 72px;
}
.content h1 { font-size: 24px; margin: 44px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.content h2 { font-size: 20px; margin: 38px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.content h3 { font-size: 17px; margin: 30px 0 10px; }
.content h4 { font-size: 15px; margin: 24px 0 8px; }
.content p { margin: 13px 0; }
.content a { color: var(--primary); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.15s; }
.content a:hover { border-bottom-color: var(--primary); }
.content strong { color: var(--text); font-weight: 700; }
.content em { color: var(--text); }

/* 标题锚点 */
.heading-anchor {
    opacity: 0; position: absolute; left: -22px; top: 50%; transform: translateY(-50%);
    color: var(--text-secondary); font-size: 16px; text-decoration: none; border: none;
    transition: opacity 0.15s; line-height: 1;
}
.content h1, .content h2, .content h3, .content h4 { position: relative; }
.content h1:hover .heading-anchor,
.content h2:hover .heading-anchor,
.content h3:hover .heading-anchor,
.content h4:hover .heading-anchor { opacity: 1; }

/* 列表 */
.content ul, .content ol { padding-left: 28px; margin: 13px 0; }
.content li { margin: 6px 0; }
.content li > ul, .content li > ol { margin: 4px 0; }
.content ul { list-style-type: disc; }
.content ul ul { list-style-type: circle; }
.content ul ul ul { list-style-type: square; }
.content ol { list-style-type: decimal; }

/* 任务列表 */
.content input[type="checkbox"] {
    margin-right: 8px; accent-color: var(--primary);
    width: 15px; height: 15px; vertical-align: -2px;
}
.content ul:has(input[type="checkbox"]) { list-style: none; padding-left: 4px; }

/* 代码 */
.content code {
    font-family: var(--mono); font-size: 13.5px; font-weight: 500;
    background: var(--code-bg); padding: 2px 6px; border-radius: 5px;
    border: 1px solid var(--code-border); color: var(--text);
    word-break: break-word;
}
.content pre {
    background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 10px;
    padding: 0; overflow-x: auto; margin: 18px 0; position: relative;
}
.content pre code {
    display: block; padding: 16px 18px; background: none; border: none;
    font-size: 13px; line-height: 1.6; color: var(--text-secondary);
    border-radius: 0;
}
.code-lang {
    position: absolute; top: 0; right: 0; padding: 4px 12px;
    font-size: 11px; font-family: var(--mono);
    color: var(--text-secondary); border-bottom: 1px solid var(--code-border);
    border-left: 1px solid var(--code-border); border-radius: 0 10px 0 6px;
    background: var(--code-bg);
}

/* 引用 */
.content blockquote {
    border-left: 4px solid var(--primary);
    background: var(--blockquote-bg);
    padding: 12px 18px; margin: 18px 0; border-radius: 0 8px 8px 0;
    color: var(--text-secondary);
}
.content blockquote p { margin: 6px 0; }
.content blockquote strong { color: var(--primary); }

/* 表格 */
.table-wrap {
    margin: 18px 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    overflow-x: auto;
}
.table-wrap table { width: 100%; border-collapse: collapse; margin: 0; font-size: 14px; }
.table-wrap th {
    font-weight: 700; padding: 11px 15px; text-align: left;
    border-bottom: 2px solid var(--border); color: var(--text); font-size: 13px;
    white-space: nowrap; background: var(--code-bg);
}
.table-wrap td { padding: 9px 15px; border-bottom: 1px solid var(--border); vertical-align: top; }
.table-wrap tr:last-child td { border-bottom: none; }
.table-wrap tr:nth-child(even) { background: var(--table-stripe); }
.table-wrap tr:hover { background: var(--primary-soft); }
.content > table {
    width: 100%; border-collapse: collapse; margin: 18px 0;
    font-size: 14px; border: 1px solid var(--border); border-radius: 10px;
    display: block; overflow-x: auto;
}

/* 分割线 / 图片 / 其它 */
.content hr { border: none; border-top: 2px solid var(--border); margin: 36px 0; border-radius: 2px; }
.content img { max-width: 100%; border-radius: 10px; margin: 18px 0; display: block; border: 1px solid var(--border); }
.content img[src$=".svg"] { border: none; }
.content abbr { text-decoration: underline dotted; cursor: help; }
.content details { border: 1px solid var(--border); border-radius: 8px; padding: 13px 16px; margin: 15px 0; }
.content summary { cursor: pointer; font-weight: 600; color: var(--text); }
.content kbd {
    font-family: var(--mono); font-size: 12px;
    background: var(--code-bg); border: 1px solid var(--code-border);
    border-radius: 4px; padding: 2px 6px; box-shadow: 0 1px 0 var(--border);
}
.content mark { background: #fff3cd; color: inherit; padding: 1px 4px; border-radius: 3px; }

/* 空态 */
.error { text-align: center; padding: 70px 0; color: var(--text-secondary); }
.error .icon { font-size: 44px; margin-bottom: 14px; }

/* 页脚 */
footer {
    text-align: center; padding: 36px 28px 48px; font-size: 13px;
    color: var(--text-secondary);
}
footer a { color: var(--text-secondary); text-decoration: none; }
footer a:hover { color: var(--text); }

/* 回到顶部 */
.back-to-top {
    position: fixed; bottom: 32px; right: 32px; z-index: 30;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--btn-bg); color: var(--btn-fg); border: none;
    font-size: 18px; cursor: pointer; opacity: 0; transform: translateY(10px);
    transition: opacity 0.25s, transform 0.25s; box-shadow: var(--btn-shadow);
    display: flex; align-items: center; justify-content: center;
}
.back-to-top.visible { opacity: 1; transform: translateY(0); }
.back-to-top:hover { transform: translateY(-2px); box-shadow: var(--btn-shadow-hover); }

/* 响应式 */
@media (max-width: 900px) {
    .toc-sidebar { display: none; }
    .page { padding: 24px 16px 8px; }
    .panel { --panel-pad: 24px; --panel-r: 14px; }
    .post-title { font-size: 22px; }
    .back-to-top { right: 20px; bottom: 20px; }
}
</style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="nav-logo">Hazel</a>
            <div class="nav-right">
                <a href="/" class="nav-back">← 返回首页</a>
                <button class="theme-toggle" id="themeToggle" title="切换明暗模式" aria-label="切换明暗模式">🌙</button>
            </div>
        </div>
    </nav>

    <div class="page">
        <aside class="toc-sidebar" id="tocSidebar">
            <div class="toc-title">目录</div>
            <nav id="tocNav"></nav>
        </aside>
        <div class="main">
            <article class="panel">
                <div id="content">
                    <div class="error"><div class="icon">⏳</div>加载中...</div>
                </div>
            </article>
        </div>
    </div>

    <footer>
        <a href="/">Hazel</a> · 写于 <span id="postDate"></span>
    </footer>

    <button class="back-to-top" id="backToTop" title="回到顶部">↑</button>

    <script>
        // ── 主题切换（共享 ui-theme） ──
        const themeToggle = document.getElementById('themeToggle');
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const next = isDark ? 'light' : 'dark';
            try { localStorage.setItem('ui-theme', next); } catch (e) {}
            applyTheme(next);
        });

        // Escape HTML
        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // Generate heading ID
        function headingId(text) {
            return text.toLowerCase().replace(/[^\w一-鿿]+/g, '-').replace(/^-|-$/g, '');
        }

        // Build TOC
        function buildTOC(container) {
            const headings = container.querySelectorAll('h1, h2, h3');
            const nav = document.getElementById('tocNav');
            if (headings.length === 0) {
                document.getElementById('tocSidebar').style.display = 'none';
                return;
            }
            let html = '';
            headings.forEach(h => {
                const id = headingId(h.textContent);
                h.id = id;
                const cls = h.tagName === 'H3' ? 'toc-h3' : '';
                html += `<a href="#${id}" class="${cls}">${escHtml(h.textContent)}</a>`;
            });
            nav.innerHTML = html;

            // Add heading anchors
            headings.forEach(h => {
                const a = document.createElement('a');
                a.className = 'heading-anchor';
                a.href = '#' + h.id;
                a.textContent = '#';
                h.prepend(a);
            });
        }

        // TOC active tracking
        function initTOCScroll() {
            const links = document.querySelectorAll('#tocNav a');
            if (links.length === 0) return;
            const headings = Array.from(document.querySelectorAll('.content h1, .content h2, .content h3'));
            const observer = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        links.forEach(l => l.classList.remove('active'));
                        const link = document.querySelector(`#tocNav a[href="#${e.target.id}"]`);
                        if (link) link.classList.add('active');
                    }
                });
            }, { rootMargin: '-60px 0px -80% 0px' });
            headings.forEach(h => observer.observe(h));
        }

        // Back to top
        function initBackToTop() {
            const btn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                btn.classList.toggle('visible', window.scrollY > 400);
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // Add code language labels
        function addCodeLabels() {
            document.querySelectorAll('.content pre code').forEach(code => {
                const pre = code.parentElement;
                if (pre.querySelector('.code-lang')) return;
                const match = code.className.match(/language-(\w+)/);
                if (match) {
                    const label = document.createElement('span');
                    label.className = 'code-lang';
                    label.textContent = match[1];
                    pre.appendChild(label);
                }
            });
        }

        // Custom marked renderer (marked.js v14 token-based API)
        const renderer = {
            image(token) {
                const titleAttr = token.title ? ` title="${escHtml(token.title)}"` : '';
                return `<img src="${token.href}" alt="${token.text}"${titleAttr} loading="lazy">`;
            },
            code(token) {
                const lang = (token.lang || '').trim();
                const langClass = lang ? ` class="language-${escHtml(lang)}"` : '';
                return `<pre><code${langClass}>${escHtml(token.text)}</code></pre>`;
            }
        };

        marked.use({
            renderer: renderer,
            gfm: true,
            breaks: false,
            pedantic: false,
        });

        // Main
        (async function () {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const container = document.getElementById('content');

            if (!slug) {
                container.innerHTML = '<div class="error"><div class="icon">⚠️</div>未指定文章</div>';
                return;
            }

            try {
                const metaResp = await fetch('posts.json');
                if (!metaResp.ok) throw new Error('posts.json 加载失败');
                const posts = await metaResp.json();
                const meta = posts.find(p => p.slug === slug);

                if (!meta) {
                    container.innerHTML = '<div class="error"><div class="icon">🔍</div>文章未找到</div>';
                    return;
                }

                document.title = meta.title + ' - HazelBox';
                document.getElementById('postDate').textContent = meta.date;

                // Calculate reading time
                const mdResp = await fetch(`posts/${slug}.md`);
                if (!mdResp.ok) throw new Error('Markdown 文件未找到');
                const md = await mdResp.text();
                const wordCount = md.replace(/\s/g, '').length;
                const readTime = Math.max(1, Math.ceil(wordCount / 400));

                const html = marked.parse(md);
                // Post-process: wrap tables for border-radius styling
                const wrappedHtml = html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '</table></div>');
                container.innerHTML = `
                    <div class="post-header">
                        <div class="post-date">${meta.date}</div>
                        <h1 class="post-title">${meta.title}</h1>
                        <div class="post-meta">
                            <span>📖 约 ${readTime} 分钟</span>
                            <span>📝 ${wordCount.toLocaleString()} 字</span>
                        </div>
                    </div>
                    <div class="content">${wrappedHtml}</div>
                `;

                // Post-render enhancements
                buildTOC(container.querySelector('.content'));
                initTOCScroll();
                addCodeLabels();
                initBackToTop();
            } catch (e) {
                container.innerHTML = '<div class="error"><div class="icon">⚠️</div>加载失败：' + escHtml(e.message) + '</div>';
            }
        })();
    </script>
</body>
</html>
