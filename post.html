<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="postTitle">文章</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.0/marked.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #4a4a4a;
            --text-muted: #999999;
            --border: #e5e5e5;
            --accent: #2563eb;
            --accent-soft: #eff6ff;
            --code-bg: #f6f8fa;
            --code-border: #e1e4e8;
            --table-stripe: #f8f9fa;
            --blockquote-bg: #f8f9fa;
            --blockquote-border: #2563eb;
            --font: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --mono: "Cascadia Code", "Fira Code", "JetBrains Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
            --max-width: 760px;
            --toc-w: 240px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --text: #e6edf3;
                --text-secondary: #c9d1d9;
                --text-muted: #8b949e;
                --border: #30363d;
                --accent: #58a6ff;
                --accent-soft: #0d2847;
                --code-bg: #161b22;
                --code-border: #30363d;
                --table-stripe: #161b22;
                --blockquote-bg: #161b22;
                --blockquote-border: #58a6ff;
            }
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-size: 17px;
        }

        /* ── Nav ── */
        nav {
            position: sticky; top: 0; z-index: 20;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .nav-inner {
            max-width: calc(var(--max-width) + var(--toc-w) + 80px);
            margin: 0 auto; padding: 0 28px;
            display: flex; justify-content: space-between; align-items: center; height: 56px;
        }
        .nav-logo { font-weight: 700; font-size: 18px; text-decoration: none; color: var(--text); letter-spacing: -0.3px; }
        .nav-back { text-decoration: none; color: var(--text-muted); font-size: 14px; transition: color 0.15s; }
        .nav-back:hover { color: var(--text); }

        /* ── Layout ── */
        .page {
            max-width: calc(var(--max-width) + var(--toc-w) + 80px);
            margin: 0 auto; padding: 48px 28px;
            display: flex; gap: 48px; align-items: flex-start;
        }
        .main { flex: 1; min-width: 0; }

        /* ── TOC ── */
        .toc-sidebar {
            position: sticky; top: 80px; width: var(--toc-w); flex-shrink: 0;
            font-size: 13px; line-height: 1.6;
            max-height: calc(100vh - 120px); overflow-y: auto;
        }
        .toc-sidebar::-webkit-scrollbar { width: 4px; }
        .toc-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .toc-title {
            font-weight: 700; font-size: 12px; text-transform: uppercase;
            letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 12px;
        }
        .toc-sidebar a {
            display: block; color: var(--text-muted); text-decoration: none;
            padding: 3px 0; transition: color 0.15s; border-left: 2px solid transparent;
            padding-left: 10px;
        }
        .toc-sidebar a:hover, .toc-sidebar a.active { color: var(--accent); border-left-color: var(--accent); }
        .toc-sidebar a.toc-h3 { padding-left: 24px; font-size: 12px; }

        /* ── Post header ── */
        .post-header { margin-bottom: 40px; }
        .post-date { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; font-weight: 500; }
        .post-title { font-size: 36px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.25; }
        .post-meta { display: flex; gap: 16px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--text-muted); }

        /* ── Content ── */
        .content { font-size: 17px; color: var(--text-secondary); }
        .content > *:first-child { margin-top: 0 !important; }

        .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 {
            color: var(--text); font-weight: 700; line-height: 1.35;
        }
        .content h1 { font-size: 28px; margin: 48px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .content h2 { font-size: 22px; margin: 40px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
        .content h3 { font-size: 18px; margin: 32px 0 10px; }
        .content h4 { font-size: 16px; margin: 24px 0 8px; }

        .content p { margin: 14px 0; }
        .content a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.15s; }
        .content a:hover { border-bottom-color: var(--accent); }

        .content strong { color: var(--text); font-weight: 700; }
        .content em { color: var(--text); }

        /* Headings with anchor */
        .content h1, .content h2, .content h3, .content h4 {
            position: relative;
        }
        .heading-anchor {
            opacity: 0; position: absolute; left: -24px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 18px; text-decoration: none; border: none;
            transition: opacity 0.15s; line-height: 1;
        }
        .content h1:hover .heading-anchor,
        .content h2:hover .heading-anchor,
        .content h3:hover .heading-anchor,
        .content h4:hover .heading-anchor { opacity: 1; }

        /* Lists */
        .content ul, .content ol { padding-left: 28px; margin: 14px 0; }
        .content li { margin: 6px 0; }
        .content li > ul, .content li > ol { margin: 4px 0; }
        .content ul { list-style-type: disc; }
        .content ul ul { list-style-type: circle; }
        .content ul ul ul { list-style-type: square; }
        .content ol { list-style-type: decimal; }

        /* Task list */
        .content input[type="checkbox"] {
            margin-right: 8px; accent-color: var(--accent);
            width: 15px; height: 15px; vertical-align: -2px;
        }
        .content ul:has(input[type="checkbox"]) { list-style: none; padding-left: 4px; }

        /* Code */
        .content code {
            font-family: var(--mono); font-size: 14px; font-weight: 500;
            background: var(--code-bg); padding: 3px 7px; border-radius: 5px;
            border: 1px solid var(--code-border); color: var(--text);
            word-break: break-word;
        }
        .content pre {
            background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 10px;
            padding: 0; overflow-x: auto; margin: 20px 0; position: relative;
        }
        .content pre code {
            display: block; padding: 18px 20px; background: none; border: none;
            font-size: 13.5px; line-height: 1.6; color: var(--text-secondary);
            border-radius: 0;
        }
        .code-lang {
            position: absolute; top: 0; right: 0; padding: 4px 12px;
            font-size: 11px; font-family: var(--mono);
            color: var(--text-muted); border-bottom: 1px solid var(--code-border);
            border-left: 1px solid var(--code-border); border-radius: 0 10px 0 6px;
            background: var(--code-bg);
        }

        /* Blockquote */
        .content blockquote {
            border-left: 4px solid var(--blockquote-border);
            background: var(--blockquote-bg);
            padding: 14px 20px; margin: 20px 0; border-radius: 0 8px 8px 0;
            color: var(--text-secondary);
        }
        .content blockquote p { margin: 6px 0; }
        .content blockquote strong { color: var(--accent); }

        /* Table */
        .table-wrap {
            margin: 20px 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            overflow-x: auto;
        }
        .table-wrap table {
            width: 100%; border-collapse: collapse; margin: 0;
            font-size: 14.5px; min-width: 500px;
        }
        .content thead { background: var(--code-bg); }
        .content th {
            font-weight: 700; padding: 12px 16px; text-align: left;
            border-bottom: 2px solid var(--border); color: var(--text); font-size: 13px;
            text-transform: uppercase; letter-spacing: 0.3px;
        }
        .content td {
            padding: 10px 16px; border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        .content tr:last-child td { border-bottom: none; }
        .content tbody tr:nth-child(even) { background: var(--table-stripe); }
        .content tbody tr:hover { background: var(--accent-soft); }

        /* Horizontal rule */
        .content hr {
            border: none; border-top: 2px solid var(--border);
            margin: 40px 0; border-radius: 2px;
        }

        /* Images */
        .content img {
            max-width: 100%; border-radius: 10px; margin: 20px 0;
            display: block; border: 1px solid var(--border);
        }
        .content img[src$=".svg"] { border: none; }

        /* Abbreviation */
        .content abbr { text-decoration: underline dotted; cursor: help; }

        /* Details / Summary */
        .content details {
            border: 1px solid var(--border); border-radius: 8px;
            padding: 14px 18px; margin: 16px 0;
        }
        .content summary { cursor: pointer; font-weight: 600; color: var(--text); }

        /* Keyboard */
        .content kbd {
            font-family: var(--mono); font-size: 12px;
            background: var(--code-bg); border: 1px solid var(--code-border);
            border-radius: 4px; padding: 2px 6px; box-shadow: 0 1px 0 var(--border);
        }

        /* Mark / highlight */
        .content mark { background: #fff3cd; color: inherit; padding: 1px 4px; border-radius: 3px; }

        /* Empty state */
        .error { text-align: center; padding: 80px 0; color: var(--text-muted); }
        .error .icon { font-size: 48px; margin-bottom: 16px; }

        /* Footer */
        footer {
            text-align: center; padding: 48px 28px; font-size: 13px;
            color: var(--text-muted); border-top: 1px solid var(--border);
            margin-top: 48px;
        }
        footer a { color: var(--text-secondary); text-decoration: none; }
        footer a:hover { color: var(--text); }

        /* Back to top */
        .back-to-top {
            position: fixed; bottom: 32px; right: 32px; z-index: 30;
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--accent); color: #fff; border: none;
            font-size: 18px; cursor: pointer; opacity: 0; transform: translateY(10px);
            transition: opacity 0.25s, transform 0.25s; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            display: flex; align-items: center; justify-content: center;
        }
        .back-to-top.visible { opacity: 1; transform: translateY(0); }
        .back-to-top:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }

        /* Responsive */
        @media (max-width: 900px) {
            .toc-sidebar { display: none; }
            .page { padding: 32px 20px; }
            .post-title { font-size: 28px; }
            .content { font-size: 16px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="nav-logo">Hazel</a>
            <a href="/" class="nav-back">← 首页</a>
        </div>
    </nav>

    <div class="page">
        <div class="toc-sidebar" id="tocSidebar">
            <div class="toc-title">目录</div>
            <nav id="tocNav"></nav>
        </div>
        <div class="main">
            <div id="content">
                <div class="error"><div class="icon">⏳</div>加载中...</div>
            </div>
        </div>
    </div>

    <footer>
        <a href="/">Hazel</a> · 写于 <span id="postDate"></span>
    </footer>

    <button class="back-to-top" id="backToTop" title="回到顶部">↑</button>

    <script>
        // Escape HTML
        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // Generate heading ID
        function headingId(text) {
            return text.toLowerCase().replace(/[^\w一-鿿]+/g, '-').replace(/^-|-$/g, '');
        }

        // Build TOC
        function buildTOC(container) {
            const headings = container.querySelectorAll('h1, h2, h3');
            const nav = document.getElementById('tocNav');
            if (headings.length === 0) {
                document.getElementById('tocSidebar').style.display = 'none';
                return;
            }
            let html = '';
            headings.forEach(h => {
                const id = headingId(h.textContent);
                h.id = id;
                const cls = h.tagName === 'H3' ? 'toc-h3' : '';
                html += `<a href="#${id}" class="${cls}">${escHtml(h.textContent)}</a>`;
            });
            nav.innerHTML = html;

            // Add heading anchors
            headings.forEach(h => {
                const a = document.createElement('a');
                a.className = 'heading-anchor';
                a.href = '#' + h.id;
                a.textContent = '#';
                h.prepend(a);
            });
        }

        // TOC active tracking
        function initTOCScroll() {
            const links = document.querySelectorAll('#tocNav a');
            if (links.length === 0) return;
            const headings = Array.from(document.querySelectorAll('.content h1, .content h2, .content h3'));
            const observer = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        links.forEach(l => l.classList.remove('active'));
                        const link = document.querySelector(`#tocNav a[href="#${e.target.id}"]`);
                        if (link) link.classList.add('active');
                    }
                });
            }, { rootMargin: '-40px 0px -80% 0px' });
            headings.forEach(h => observer.observe(h));
        }

        // Back to top
        function initBackToTop() {
            const btn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                btn.classList.toggle('visible', window.scrollY > 400);
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // Add code language labels
        function addCodeLabels() {
            document.querySelectorAll('.content pre code').forEach(code => {
                const pre = code.parentElement;
                if (pre.querySelector('.code-lang')) return;
                const match = code.className.match(/language-(\w+)/);
                if (match) {
                    const label = document.createElement('span');
                    label.className = 'code-lang';
                    label.textContent = match[1];
                    pre.appendChild(label);
                }
            });
        }

        // Custom marked renderer
        const renderer = new marked.Renderer();

        // Table wrapper for responsive scroll
        renderer.table = function(header, body) {
            return `<div class="table-wrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
        };

        // Image with loading lazy
        renderer.image = function(href, title, text) {
            const titleAttr = title ? ` title="${escHtml(title)}"` : '';
            return `<img src="${href}" alt="${escHtml(text)}"${titleAttr} loading="lazy">`;
        };

        // Code blocks with language class
        renderer.code = function(code, infostring) {
            const lang = (infostring || '').trim();
            const langClass = lang ? ` class="language-${escHtml(lang)}"` : '';
            return `<pre><code${langClass}>${escHtml(code)}</code></pre>`;
        };

        marked.setOptions({
            renderer: renderer,
            gfm: true,
            breaks: false,
            pedantic: false,
        });

        // Main
        (async function () {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const container = document.getElementById('content');

            if (!slug) {
                container.innerHTML = '<div class="error"><div class="icon">⚠️</div>未指定文章</div>';
                return;
            }

            try {
                const metaResp = await fetch('posts.json');
                if (!metaResp.ok) throw new Error('posts.json 加载失败');
                const posts = await metaResp.json();
                const meta = posts.find(p => p.slug === slug);

                if (!meta) {
                    container.innerHTML = '<div class="error"><div class="icon">🔍</div>文章未找到</div>';
                    return;
                }

                document.title = meta.title + ' - Hazel';
                document.getElementById('postDate').textContent = meta.date;

                // Calculate reading time
                const mdResp = await fetch(`posts/${slug}.md`);
                if (!mdResp.ok) throw new Error('Markdown 文件未找到');
                const md = await mdResp.text();
                const wordCount = md.replace(/\s/g, '').length;
                const readTime = Math.max(1, Math.ceil(wordCount / 400));

                const html = marked.parse(md);
                container.innerHTML = `
                    <div class="post-header">
                        <div class="post-date">${meta.date}</div>
                        <h1 class="post-title">${meta.title}</h1>
                        <div class="post-meta">
                            <span>📖 约 ${readTime} 分钟</span>
                            <span>📝 ${wordCount.toLocaleString()} 字</span>
                        </div>
                    </div>
                    <div class="content">${html}</div>
                `;

                // Post-render enhancements
                buildTOC(container.querySelector('.content'));
                initTOCScroll();
                addCodeLabels();
                initBackToTop();
            } catch (e) {
                container.innerHTML = '<div class="error"><div class="icon">⚠️</div>加载失败：' + escHtml(e.message) + '</div>';
            }
        })();
    </script>
</body>
</html>
