<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="postTitle">文章</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.0/marked.min.js"></script>
    <style>
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --text: #171717;
            --text-secondary: #525252;
            --text-muted: #a3a3a3;
            --border: #e5e5e5;
            --accent: #2563eb;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            --mono: "Cascadia Code", "Fira Code", "SF Mono", Consolas, monospace;
            --max-width: 720px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0a0a;
                --surface: #171717;
                --text: #ededed;
                --text-secondary: #a3a3a3;
                --text-muted: #525252;
                --border: #262626;
                --accent: #3b82f6;
            }
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }
        nav {
            position: sticky; top: 0; z-index: 10;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .nav-inner {
            max-width: var(--max-width); margin: 0 auto; padding: 0 24px;
            display: flex; justify-content: space-between; align-items: center; height: 56px;
        }
        .nav-logo { font-weight: 700; font-size: 18px; text-decoration: none; color: var(--text); }
        .nav-back { text-decoration: none; color: var(--text-secondary); font-size: 14px; }
        .nav-back:hover { color: var(--text); }

        .container { max-width: var(--max-width); margin: 0 auto; padding: 48px 24px; }
        .post-header { margin-bottom: 40px; }
        .post-date { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
        .post-title { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.3; }

        /* Markdown rendered content */
        .content { font-size: 16px; }
        .content h1 { font-size: 28px; margin: 40px 0 16px; font-weight: 700; }
        .content h2 { font-size: 22px; margin: 36px 0 12px; font-weight: 700; }
        .content h3 { font-size: 18px; margin: 28px 0 10px; font-weight: 600; }
        .content p { margin: 12px 0; color: var(--text-secondary); }
        .content ul, .content ol { padding-left: 24px; margin: 12px 0; color: var(--text-secondary); }
        .content li { margin: 4px 0; }
        .content code {
            font-family: var(--mono); font-size: 14px;
            background: var(--surface); padding: 2px 6px; border-radius: 4px;
            border: 1px solid var(--border);
        }
        .content pre {
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
            padding: 16px; overflow-x: auto; margin: 16px 0;
        }
        .content pre code { background: none; border: none; padding: 0; }
        .content blockquote {
            border-left: 3px solid var(--accent); padding-left: 16px; margin: 16px 0;
            color: var(--text-muted);
        }
        .content a { color: var(--accent); text-decoration: none; }
        .content a:hover { text-decoration: underline; }
        .content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
        .content img { max-width: 100%; border-radius: 8px; margin: 16px 0; }

        .error { text-align: center; padding: 80px 0; color: var(--text-muted); }
        .error .icon { font-size: 48px; margin-bottom: 16px; }

        footer {
            text-align: center; padding: 48px 24px; font-size: 13px; color: var(--text-muted);
        }
        footer a { color: var(--text-secondary); text-decoration: none; }
        footer a:hover { color: var(--text); }
    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="nav-logo">Hazel</a>
            <a href="/" class="nav-back">← 首页</a>
        </div>
    </nav>

    <div class="container" id="content">
        <div class="error"><div class="icon">⏳</div>加载中...</div>
    </div>

    <footer>
        <a href="/">Hazel</a> · 写于 <span id="postDate"></span>
    </footer>

    <script>
        (async function () {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const container = document.getElementById('content');

            if (!slug) {
                container.innerHTML = '<div class="error"><div class="icon">⚠️</div>未指定文章</div>';
                return;
            }

            try {
                // Load posts.json to get metadata
                const metaResp = await fetch('posts.json');
                const posts = await metaResp.json();
                const meta = posts.find(p => p.slug === slug);

                if (!meta) {
                    container.innerHTML = '<div class="error"><div class="icon">🔍</div>文章未找到</div>';
                    return;
                }

                document.title = meta.title + ' - Hazel';
                document.getElementById('postDate').textContent = meta.date;

                // Load markdown content
                const mdResp = await fetch(`posts/${slug}.md`);
                if (!mdResp.ok) throw new Error('Markdown not found');
                const md = await mdResp.text();

                // Render
                const html = marked.parse(md);
                container.innerHTML = `
                    <div class="post-header">
                        <div class="post-date">${meta.date}</div>
                        <h1 class="post-title">${meta.title}</h1>
                    </div>
                    <div class="content">${html}</div>
                `;
            } catch (e) {
                container.innerHTML = '<div class="error"><div class="icon">⚠️</div>加载失败：' + e.message + '</div>';
            }
        })();
    </script>
</body>
</html>
