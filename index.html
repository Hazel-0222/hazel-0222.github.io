<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazel · 代码与像素</title>
    <style>
        :root {
            --bg: #f8f8f7;
            --sidebar-bg: #f2f1ef;
            --surface: #ffffff;
            --surface-hover: #f5f5f5;
            --text: #1a1a1a;
            --text-secondary: #5c5c5c;
            --text-muted: #999999;
            --border: #e8e8e6;
            --accent: #2563eb;
            --accent-soft: #eff6ff;
            --radius: 10px;
            --radius-lg: 16px;
            --shadow: 0 1px 2px rgba(0,0,0,0.03);
            --shadow-lg: 0 4px 20px rgba(0,0,0,0.05);
            --font: "Microsoft YaHei", "微软雅黑", -apple-system, BlinkMacSystemFont, sans-serif;
            --sidebar-w: 320px;
            --content-max: 760px;
        }
        /* 手动深色 */
        [data-theme="dark"] {
            --bg: #0d0d0d;
            --sidebar-bg: #111111;
            --surface: #1a1a1a;
            --surface-hover: #222222;
            --text: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-muted: #555555;
            --border: #222222;
            --accent: #3b82f6;
            --accent-soft: #1e293b;
            --shadow: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-lg: 0 4px 20px rgba(0,0,0,0.4);
        }
        /* 系统深色（无手动设置时生效） */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0d0d0d;
                --sidebar-bg: #111111;
                --surface: #1a1a1a;
                --surface-hover: #222222;
                --text: #e8e8e8;
                --text-secondary: #a0a0a0;
                --text-muted: #555555;
                --border: #222222;
                --accent: #3b82f6;
                --accent-soft: #1e293b;
                --shadow: 0 1px 2px rgba(0,0,0,0.2);
                --shadow-lg: 0 4px 20px rgba(0,0,0,0.4);
            }
        }
        /* 手动浅色：覆盖系统深色 */
        [data-theme="light"] {
            --bg: #f8f8f7;
            --sidebar-bg: #f2f1ef;
            --surface: #ffffff;
            --surface-hover: #f5f5f5;
            --text: #1a1a1a;
            --text-secondary: #5c5c5c;
            --text-muted: #999999;
            --border: #e8e8e6;
            --accent: #2563eb;
            --accent-soft: #eff6ff;
            --shadow: 0 1px 2px rgba(0,0,0,0.03);
            --shadow-lg: 0 4px 20px rgba(0,0,0,0.05);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            display: flex;
            min-height: 100vh;
        }

        /* ─── Sidebar ─── */
        .sidebar {
            width: var(--sidebar-w);
            min-height: 100vh;
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 56px 40px;
            background: var(--sidebar-bg);
            flex-shrink: 0;
        }
        .sidebar-top {
            margin-bottom: 40px;
        }
        .sidebar-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 0 3px var(--sidebar-bg), 0 0 0 5px var(--border);
        }
        .sidebar-avatar-fallback {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #7c3aed, #db2777);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
            box-shadow: 0 0 0 3px var(--sidebar-bg), 0 0 0 5px var(--border);
        }
        .sidebar-name {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .sidebar-tagline {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: auto;
        }
        .sidebar-nav a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 -12px;
        }
        .sidebar-nav a:hover {
            color: var(--text);
            background: var(--surface-hover);
        }
        .sidebar-nav .nav-icon { font-size: 15px; width: 20px; text-align: center; }

        .sidebar-contact {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .sidebar-contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-decoration: none;
        }
        .sidebar-contact-item:hover { color: var(--text); }
        .sidebar-contact-icon {
            width: 18px;
            text-align: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .sidebar-links {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar-links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.15s;
            width: fit-content;
        }
        .btn-primary {
            background: var(--text);
            color: var(--bg);
        }
        .btn-primary:hover { opacity: 0.85; }
        .btn-outline {
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover { background: var(--surface-hover); }

        .sidebar-footer {
            margin-top: 28px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.15s;
            line-height: 1;
        }
        .theme-toggle:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        /* ─── Main Content ─── */
        .main {
            flex: 1;
            min-width: 0;
            padding: 56px 56px;
            max-width: var(--content-max);
        }

        /* ─── Section ─── */
        section {
            margin-bottom: 60px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        /* ─── Tools ─── */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }
        .tool-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.2s;
            box-shadow: var(--shadow);
        }
        .tool-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: #c0c0c0;
        }
        .tool-card .icon {
            font-size: 26px;
            margin-bottom: 10px;
        }
        .tool-card .name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .tool-card .desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .tools-category {
            margin-bottom: 28px;
        }
        .tools-category:last-child { margin-bottom: 0; }
        .tools-category-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-left: 2px;
        }

        /* ─── Posts ─── */
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .post-item {
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding: 12px 14px;
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--text);
            transition: background 0.15s;
            margin: 0 -14px;
        }
        .post-item:hover { background: var(--surface); }
        .post-date {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            min-width: 80px;
        }
        .post-title {
            font-size: 15px;
            font-weight: 500;
            flex: 1;
        }
        .post-item .arrow {
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.15s;
        }
        .post-item:hover .arrow { opacity: 1; }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ─── About ─── */
        .about-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow);
        }
        .about-card p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.8;
        }
        .about-card p + p { margin-top: 12px; }

        /* ─── Divider ─── */
        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 0 0 60px 0;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%;
                min-height: auto;
                position: static;
                padding: 36px 24px;
                flex-direction: column;
                align-items: flex-start;
            }
            .sidebar-top { margin-bottom: 24px; }
            .sidebar-nav { flex-direction: row; gap: 12px; }
            .sidebar-nav a { margin: 0 -8px; padding: 8px 8px; }
            .sidebar-contact { margin-top: 20px; padding-top: 16px; }
            .sidebar-links { margin-top: 16px; flex-direction: row; }
            .main { padding: 36px 24px; max-width: none; }
            .tools-grid { grid-template-columns: 1fr; }
            .post-item { margin: 0 -8px; padding: 10px 8px; }
        }
    </style>
</head>
<body>

    <!-- ─── Sidebar ─── -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <img class="sidebar-avatar" id="avatarImg" src="" alt="avatar" style="display:none" onload="this.style.display='block'">
            <div class="sidebar-avatar-fallback" id="avatarFallback">🦊</div>
            <div class="sidebar-name">Hazel</div>
            <div class="sidebar-tagline">游戏本地化 PM<br>业余写点小工具</div>
        </div>

        <nav class="sidebar-nav">
            <a href="#tools"><span class="nav-icon">🔧</span> 工具</a>
            <a href="#posts"><span class="nav-icon">📝</span> 文章</a>
            <a href="#about"><span class="nav-icon">👋</span> 关于</a>
        </nav>

        <div class="sidebar-contact">
            <a class="sidebar-contact-item" href="tel:+8613527202928">
                <span class="sidebar-contact-icon">📞</span> +86 135 2720 2928
            </a>
            <a class="sidebar-contact-item" href="mailto:970484966@qq.com">
                <span class="sidebar-contact-icon">✉️</span> 970484966@qq.com
            </a>
        </div>

        <div class="sidebar-links">
            <a href="https://github.com/Hazel-0222" class="btn-outline" target="_blank" rel="noopener">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.605-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12 24 5.37 18.63 0 12 0z"/></svg>
                GitHub
            </a>
            <a href="https://hazel-0222.github.io/tools/" class="btn-primary" target="_blank" rel="noopener">
                全部工具 →
            </a>
        </div>

        <div class="sidebar-footer">
            <span>© 2026 Hazel</span>
            <button class="theme-toggle" id="themeToggle" title="切换深浅模式">🌓</button>
        </div>
    </aside>

    <!-- ─── Main Content ─── -->
    <main class="main">

        <!-- Tools -->
        <section id="tools">
            <div class="section-title">🔧 常用工具</div>
            <div id="toolsContainer">
                <div class="empty-state">加载中...</div>
            </div>
        </section>

        <hr>

        <!-- Posts -->
        <section id="posts">
            <div class="section-title">📝 文章</div>
            <div class="post-list" id="postList">
                <div class="empty-state">加载中...</div>
            </div>
        </section>

        <hr>

        <!-- About -->
        <section id="about">
            <div class="section-title">👋 关于</div>
            <div class="about-card">
                <p>游戏行业本地化 PM，日常和 Excel、Word、SVN、TAPD 打交道。</p>
                <p>工作里重复劳动太多，慢慢写了一些小工具给自己用。都是纯前端 HTML 页面，打开浏览器就能跑，数据不离开你的电脑。</p>
                <p>所有工具开源在 <a href="https://github.com/Hazel-0222/tools" target="_blank" rel="noopener" style="color: var(--accent);">GitHub</a>，欢迎提 issue 或 PR。</p>
            </div>
        </section>

    </main>

    <script>
        // Load GitHub avatar
        (async function loadAvatar() {
            const img = document.getElementById('avatarImg');
            const fallback = document.getElementById('avatarFallback');
            try {
                const resp = await fetch('https://api.github.com/users/Hazel-0222');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.avatar_url) {
                        img.src = data.avatar_url;
                        img.style.display = 'block';
                        return;
                    }
                }
            } catch (e) {
                // API unavailable, show fallback
            }
            fallback.style.display = 'flex';
        })();

        // Load tools from tools.json, grouped by category
        (async function loadTools() {
            const container = document.getElementById('toolsContainer');
            try {
                const resp = await fetch('https://hazel-0222.github.io/tools/tools.json');
                if (!resp.ok) throw new Error('Failed to load');
                const tools = await resp.json();
                if (tools.length === 0) {
                    container.innerHTML = '<div class="empty-state">暂无工具</div>';
                    return;
                }
                const groups = {};
                for (const t of tools) {
                    if (!groups[t.category]) groups[t.category] = [];
                    groups[t.category].push(t);
                }
                const categoryOrder = ['Word', 'Excel', 'Image'];
                container.innerHTML = categoryOrder
                    .filter(cat => groups[cat])
                    .map(cat => `
                        <div class="tools-category">
                            <div class="tools-category-title">${escHtml(cat)}</div>
                            <div class="tools-grid">
                                ${groups[cat].map(t => `
                                    <a href="https://hazel-0222.github.io/tools/${t.path}" class="tool-card" target="_blank" rel="noopener">
                                        <div class="icon">${escHtml(t.icon)}</div>
                                        <div class="name">${escHtml(t.name)}</div>
                                        <div class="desc">${escHtml(t.desc)}</div>
                                    </a>
                                `).join('')}
                            </div>
                        </div>
                    `).join('');
            } catch (e) {
                container.innerHTML = '<div class="empty-state">工具加载失败</div>';
            }
        })();

        // Load posts from posts.json
        (async function loadPosts() {
            const list = document.getElementById('postList');
            try {
                const resp = await fetch('posts.json');
                if (!resp.ok) throw new Error('Failed to load');
                const posts = await resp.json();
                if (posts.length === 0) {
                    list.innerHTML = '<div class="empty-state">准备中，想到什么写什么。</div>';
                    return;
                }
                list.innerHTML = posts.map(p => `
                    <a href="post.html?slug=${encodeURIComponent(p.slug)}" class="post-item">
                        <span class="post-date">${p.date}</span>
                        <span class="post-title">${escHtml(p.title)}</span>
                        <span class="arrow">→</span>
                    </a>
                `).join('');
            } catch (e) {
                list.innerHTML = '<div class="empty-state">准备中，想到什么写什么。</div>';
            }
        })();

        function escHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Theme toggle
        (function initTheme() {
            const html = document.documentElement;
            const saved = localStorage.getItem('theme');
            if (saved) {
                html.setAttribute('data-theme', saved);
            }
            document.getElementById('themeToggle').addEventListener('click', function() {
                const current = html.getAttribute('data-theme');
                const next = (current === 'dark') ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            });
        })();
    </script>
</body>
</html>
