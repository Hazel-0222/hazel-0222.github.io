<script>
// 主题预载（防闪烁）：与工具合集共用 localStorage['ui-theme']
(function () {
    try {
        var t = localStorage.getItem('ui-theme');
        if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
})();
</script>

:root {

}
[data-theme="dark"] {

    --page-bg-image:
        radial-gradient(900px 520px at 10% -10%, rgba(80,140,255,.13), transparent 60%),

    --card-bg: #1a1b22;
    --input-bg: #14151c;
    --text: #ededf1;
    --text-secondary: #9a9ba5;
    --border: #2a2b33;
    --primary: #5ea2f5;
    --primary-soft: rgba(94,162,245,0.16);
    --focus-ring: rgba(94,162,245,0.30);
    --hover-bg: rgba(255,255,255,0.06);
    --chip-bg: rgba(255,255,255,0.08);

    --btn-fg: #1d1d1f;

    --btn-shadow:

    --hd-veil: rgba(255,255,255,0.05);
    --shadow: 0 1px 2px rgba(0,0,0,0.5);
    --shadow-hover: 0 8px 24px rgba(0,0,0,0.5);
    --panel-shadow:

}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    background-image: var(--page-bg-image);

    background-color: var(--bg);
    color: var(--text);

.page { max-width: 1080px; margin: 0 auto; }

.layout {
    display: grid;
    grid-template-columns: 300px 1fr;

/* ══ 面板通用 ══ */
.panel {
    --panel-pad: 28px;
    --panel-r: 18px;
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: var(--panel-shadow);
    padding: var(--panel-pad);
}
.panel .hd {
    position: relative;
    z-index: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 14px;
    margin-bottom: 18px;
}
.panel .hd::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: calc(-1 * var(--panel-pad));
    left: calc(-1 * var(--panel-pad));
    right: calc(-1 * var(--panel-pad));
    bottom: 0;
    background:
        linear-gradient(var(--hd-veil), var(--hd-veil)),
        var(--page-bg-image);
    border-radius: var(--panel-r) var(--panel-r) 0 0;
}
.panel .hd .hdtext { min-width: 0; }
.panel h1, .panel .hd-title { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
.panel .subtitle { color: var(--text-secondary); font-size: 13px; margin-top: 3px; line-height: 1.55; }

/* ══ 左栏个人卡 ══ */
.sidebar-card {
    position: sticky;
    top: 36px;
}
.profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;

}
.avatar-wrap {
    width: 92px; height: 92px;
    border-radius: 50%;

    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    background: var(--primary-soft);
    display: flex;
    align-items: center;
    justify-content: center;
}
.avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
.avatar-wrap .fallback { font-size: 42px; }
.profile-name { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-top: 14px; }
.profile-tagline { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

.nav-group { margin-top: 24px; display: flex; flex-direction: column; gap: 4px; }
.nav-group a {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 10px;
    transition: background 0.15s, color 0.15s;
}
.nav-group a:hover { background: var(--hover-bg); color: var(--text); }
.nav-group a.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.nav-group .nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }

.contact-group {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;

.contact-item {

}
.contact-item:hover { color: var(--text); }

.contact-item span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--btn-bg); color: var(--btn-fg); }
.btn-primary:hover { box-shadow: var(--btn-shadow-hover); }
.btn-outline { background: var(--btn2-bg); color: var(--btn2-fg); }
.btn-outline:hover { background: linear-gradient(var(--hover-bg), var(--hover-bg)), var(--btn2-bg); box-shadow: var(--btn-shadow-hover); }
.btn svg { flex-shrink: 0; }

.sidebar-footer { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); text-align: center; font-size: 12px; color: var(--text-secondary); }

/* ══ 右栏 ══ */
.content-col { display: flex; flex-direction: column; gap: 28px; }
.content-col > .panel > .hd { margin-bottom: 20px; }

/* ── 主题按钮（贴边浮层） ── */
.theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--input-bg);
    font-size: 16px; cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.2s;
    z-index: 100;
}
.theme-toggle:hover { transform: scale(1.08); box-shadow: var(--shadow-hover); }

/* ── 工具区块（列表行式） ── */
.tool-list { display: flex; flex-direction: column; }
.tool-item {
    display: flex;
    align-items: center;

.tool-item:hover { background: var(--hover-bg); }
.tool-item + .tool-item { border-top: 1px solid var(--border); }
.ti-txt { flex: 1; min-width: 0; }
.ti-name { font-size: 15px; font-weight: 500; }
.ti-desc { font-size: 13px; color: var(--text-secondary); margin-top: 2px; line-height: 1.45; }
.ti-arrow { color: var(--text-secondary); font-size: 18px; flex-shrink: 0; }

/* ── 文章区块（复用工具列表样式） ── */
.post-list { display: flex; flex-direction: column; }
.post-item {

}
.post-item:hover { background: var(--hover-bg); }
.post-item + .post-item { border-top: 1px solid var(--border); }
.post-item .ti-name { font-size: 15px; font-weight: 500; }
.post-item .ti-desc { font-size: 13px; color: var(--text-secondary); margin-top: 2px; line-height: 1.45; }

.empty-state { text-align: center; padding: 36px 0; color: var(--text-secondary); font-size: 14px; }

/* ── 关于区块 ── */
.about-card p { color: var(--text-secondary); font-size: 14px; line-height: 1.8; }
.about-card p + p { margin-top: 12px; }
.about-card a { color: var(--primary); text-decoration: none; }
.about-card a:hover { text-decoration: underline; }

/* ── 响应式 ── */
@media (max-width: 860px) {
    body { padding: 32px 18px 48px; }
    .layout { grid-template-columns: 1fr; }
    .sidebar-card { position: static; }
    .panel { --panel-pad: 20px; --panel-r: 14px; }
    .theme-toggle { top: 14px; right: 14px; }
}
</style>
</head>

<script>
// ── 内置兜底数据（与线上 JSON 一致；file:// 直开时生效） ──
const FALLBACK_TOOLS = [
    { "name": "图片拼接", "desc": "网格拼接、长图合成，支持粘贴截图", "category": "Image", "path": "image/image-stitch/" },
    { "name": "取色器", "desc": "粘贴图片统计 Top5 主色，点击像素读色值", "category": "Image", "path": "image/color-picker/" },
    { "name": "Word 图片提取", "desc": "从 .docx 中提取所有图片，按文档顺序排列", "category": "Word", "path": "word/word-extract-images/" },
    { "name": "Word 差异对比", "desc": "对比两个 .docx 文档差异，支持导出报告", "category": "Word", "path": "word/word-diff/" },
    { "name": "Excel 目录生成", "desc": "自动生成工作表目录页，超链接跳转", "category": "Excel", "path": "excel/excel-add-toc/" }
];

// ── 工具集合工具 JSON（跨仓库读取：主站 /tools/tools.json） ──
const TOOLS_URL = 'https://hazel-0222.github.io/tools/tools.json?_=' + Date.now();
const POSTS_URL = 'posts.json?_=' + Date.now();

function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── 工具列表：列表行式（图标 + 名称 + 描述 + 箭头） ──
function renderTools(tools) {
    const container = document.getElementById('toolsContainer');
    if (!tools || tools.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无工具</div>';
        return;
    }
    const html = tools.map(t => `
        <a href="https://hazel-0222.github.io/tools/${t.path}" class="tool-item" target="_blank" rel="noopener">
            <span class="ti-txt">
                <span class="ti-name">${escHtml(t.name)}</span>
                <span class="ti-desc">${escHtml(t.desc || '')}</span>
            </span>
            <span class="ti-arrow">›</span>
        </a>
    `).join('');
    container.innerHTML = `<div class="tool-list">${html}</div>`;
}

async function loadTools() {
    try {
        const resp = await fetch(TOOLS_URL);
        if (!resp.ok) throw new Error('tools.json 不可用');
        const data = await resp.json();
        if (Array.isArray(data) && data.length) { renderTools(data); return; }
        throw new Error('tools.json 空');
    } catch (e) {
        renderTools(FALLBACK_TOOLS); // 直开 file:// 或网络失败时兜底
    }
}

// ── 文章列表 ──
const FALLBACK_POSTS = [
    { "slug": "improvised-speaking-reference", "title": "即兴回答训练参考库", "date": "2026-09-14" },
    { "slug": "hello-world", "title": "Hello World", "date": "2026-08-10" },
    { "slug": "improve-expression-skills", "title": "提高语言表达能力指南", "date": "2026-08-10" }
];

function renderPosts(posts) {
    const list = document.getElementById('postList');
    if (!posts || posts.length === 0) {
        list.innerHTML = '<div class="empty-state">准备中，想到什么写什么。</div>';
        return;
    }
    list.innerHTML = posts.map(p => `
        <a href="post.html?slug=${encodeURIComponent(p.slug)}" class="post-item">
            <span class="ti-txt">
                <span class="ti-name">${escHtml(p.title)}</span>
                <span class="ti-desc">${escHtml(p.date)}</span>
            </span>
            <span class="ti-arrow">›</span>
        </a>
    `).join('');
}

async function loadPosts() {
    try {
        const resp = await fetch(POSTS_URL);
        if (!resp.ok) throw new Error('posts.json 不可用');
        const data = await resp.json();
        if (Array.isArray(data) && data.length) { renderPosts(data); return; }
        throw new Error('posts.json 空');
    } catch (e) {
        renderPosts(FALLBACK_POSTS);
    }
}

// ── GitHub 头像 ──
async function loadAvatar() {
    const img = document.getElementById('avatarImg');
    const fallback = document.getElementById('avatarFallback');
    try {
        const resp = await fetch('https://api.github.com/users/Hazel-0222');
        if (resp.ok) {
            const data = await resp.json();
            if (data.avatar_url) {
                img.src = data.avatar_url;
                img.style.display = 'block';
                fallback.style.display = 'none';
                return;
            }
        }
    } catch (e) { /* 保持 🦊 兜底 */ }
}

// ── 主题切换（共享 ui-theme） ──
const themeToggle = document.getElementById('themeToggle');
function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    try { localStorage.setItem('ui-theme', next); } catch (e) {}
    applyTheme(next);
});

// ── 左侧导航激活高亮（简易 scroll-spy） ──
const navLinks = Array.from(document.querySelectorAll('#pageNav a'));
const sectionIds = ['tools', 'posts', 'about'];
function setActive(id) {
    navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));
}
try {
    const spy = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-20% 0px -70% 0px', threshold: 0 });
    sectionIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) spy.observe(el);
    });
} catch (e) { /* 低版本浏览器忽略 */ }

// ── 启动 ──
loadAvatar();
loadTools();
loadPosts();
</script>
</body>
</html>
